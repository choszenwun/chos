<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CHOS</title>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg fill='%23fff'%3E%3Ccircle cx='11' cy='19' r='6'/%3E%3Ccircle cx='20' cy='18' r='7'/%3E%3Ccircle cx='16' cy='14' r='6'/%3E%3Ccircle cx='23' cy='21' r='4'/%3E%3Ccircle cx='9' cy='21' r='4'/%3E%3C/g%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --coral: #FF8E6E;
            --pink:  #F4A6B8;
            --ink:   #5B5560;
            --soft:  #8A8288;

            --tile: 24vmin;
            --gap: 4vmin;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            height: 100%;
            overflow: hidden;
            color: var(--ink);
            font-family: 'Nunito', sans-serif;
            /* whiter, less blue; warm steamy glow rising from the bottom */
            background:
                radial-gradient(80% 55% at 80% -8%, rgba(255,248,232,0.7) 0%, transparent 46%),
                radial-gradient(95% 60% at 50% 114%, rgba(246,193,178,0.6) 0%, transparent 60%),
                linear-gradient(180deg, #DEEBF3 0%, #EEF3F2 32%, #F8F4EF 62%, #FBE4D7 100%);
        }

        /* warm light sweeping from top-right */
        body::before {
            content: '';
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            background: linear-gradient(212deg, rgba(255,249,232,0.5) 0%, rgba(255,249,232,0) 32%);
        }

        /* ── FLOATING CLOUDS ── */
        .cloud {
            position: fixed; z-index: 0; pointer-events: none;
            border-radius: 50%;
            background:
                radial-gradient(closest-side at 30% 60%, #fff 0%, rgba(255,255,255,0) 100%),
                radial-gradient(closest-side at 52% 42%, #fff 0%, rgba(255,255,255,0) 100%),
                radial-gradient(closest-side at 72% 60%, #fff 0%, rgba(255,255,255,0) 100%),
                radial-gradient(closest-side at 46% 68%, #fff 0%, rgba(255,255,255,0) 100%);
            filter: blur(7px);
            opacity: 0.95;
        }
        /* warm-tinted low cloud reads as soft steam */
        .cloud.warm {
            background:
                radial-gradient(closest-side at 34% 60%, #fff 0%, rgba(255,255,255,0) 100%),
                radial-gradient(closest-side at 56% 44%, #fff 0%, rgba(255,255,255,0) 100%),
                radial-gradient(closest-side at 70% 60%, rgba(255,241,235,1) 0%, rgba(255,241,235,0) 100%),
                radial-gradient(closest-side at 46% 66%, rgba(248,214,205,0.9) 0%, rgba(248,214,205,0) 100%);
        }
        .c1 { width: 230px; height: 126px; top: 13%; left: -250px; animation: drift 36s linear infinite; }
        .c2 { width: 150px; height: 84px;  top: 33%; left: -190px; opacity: 0.8; animation: drift 48s linear infinite 9s; }
        .c3 { width: 210px; height: 120px; bottom: 12%; left: -230px; opacity: 0.9; animation: drift 42s linear infinite 4s; }
        .c4 { width: 130px; height: 78px;  bottom: 24%; left: -160px; opacity: 0.7; animation: drift 54s linear infinite 15s; }
        @keyframes drift { 0% { transform: translateX(0); } 100% { transform: translateX(124vw); } }

        .screen {
            position: relative; z-index: 2;
            height: 100%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 22px 20px 16px;
        }

        /* ── HERO ── */
        .head { text-align: center; margin-bottom: 34px; animation: pop 0.7s cubic-bezier(0.2,0.8,0.3,1.4) both; }

        .wordmark {
            position: relative;
            font-family: 'Baloo 2', sans-serif;
            font-weight: 800;
            font-size: 6.2rem;
            line-height: 0.92;
            letter-spacing: 4px;
            color: #fff;
            text-shadow:
                0 0 1px #fff, 0 2px 0 #f6f9fb,
                2px 3px 0 rgba(224,214,236,0.85),
                0 6px 14px rgba(150,120,150,0.22),
                0 14px 30px rgba(150,120,150,0.16);
        }
        .wordmark::before {
            content: 'CHOS';
            position: absolute; inset: 0;
            color: #fff; filter: blur(10px); opacity: 0.85; z-index: -1;
        }

        @keyframes pop  { from{ opacity:0; transform: translateY(14px) scale(0.9);} to{ opacity:1; transform:none;} }
        @keyframes fade { from{ opacity:0; transform: translateY(8px);} to{ opacity:1; transform:none;} }

        /* ── GRID ── */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, var(--tile));
            gap: var(--gap);
            justify-content: center;
        }

        /* ── CANDY-GLASS TILE ── */
        .tile {
            position: relative;
            width: var(--tile); height: var(--tile);
            border-radius: 26px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 7px;
            text-decoration: none; cursor: pointer;
            -webkit-user-select: none; user-select: none;
            background: linear-gradient(160deg, rgba(255,255,255,0.9) 0%, rgba(255,250,247,0.6) 100%);
            border: 1.5px solid rgba(255,255,255,0.9);
            -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
            box-shadow:
                inset 0 2px 3px rgba(255,255,255,0.95),
                0 16px 26px -14px rgba(150,90,80,0.4),
                0 5px 12px -8px rgba(150,90,80,0.26);
            transition: transform 0.32s cubic-bezier(0.2,0.9,0.3,1.5), box-shadow 0.32s ease;
            animation: floatIn 0.6s ease-out both;
        }

        /* icon sits in a soft pod so it doesn't read as a flat sticker */
        .pod {
            width: calc(var(--tile) * 0.52);
            height: calc(var(--tile) * 0.52);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: radial-gradient(circle at 32% 26%, #ffffff 0%, #eef2f5 100%);
            box-shadow:
                inset 0 1px 2px rgba(255,255,255,0.95),
                inset 0 -2px 4px rgba(160,150,160,0.18),
                0 5px 10px -5px rgba(120,90,90,0.4);
            transition: transform 0.4s cubic-bezier(0.2,0.9,0.3,1.5), box-shadow 0.32s ease;
        }
        .pod svg {
            width: 54%; height: 54%; display: block;
            filter: drop-shadow(0 1px 1.5px rgba(80,60,70,0.22));
        }

        .label {
            font-family: 'Nunito', sans-serif; font-weight: 700;
            font-size: 0.5rem; letter-spacing: 1px; text-transform: lowercase;
            color: var(--soft);
            transition: color 0.25s ease;
        }

        .tile:hover {
            transform: translateY(-7px) scale(1.06) rotate(-1deg);
            box-shadow:
                inset 0 2px 3px rgba(255,255,255,1),
                0 26px 38px -16px rgba(150,90,80,0.46),
                0 0 30px -8px rgba(255,142,110,0.4);
        }
        .tile:hover .pod { transform: scale(1.08); box-shadow: inset 0 1px 2px rgba(255,255,255,1), 0 8px 14px -6px rgba(120,90,90,0.5); }
        .tile:hover .label { color: var(--coral); }
        .tile:active { transform: translateY(-2px) scale(0.97); }
        .tile:focus-visible { outline: 2px solid var(--coral); outline-offset: 4px; }

        .tile:nth-child(1){animation-delay:.2s}.tile:nth-child(2){animation-delay:.26s}.tile:nth-child(3){animation-delay:.32s}
        .tile:nth-child(4){animation-delay:.38s}.tile:nth-child(5){animation-delay:.44s}.tile:nth-child(6){animation-delay:.5s}
        .tile:nth-child(7){animation-delay:.56s}.tile:nth-child(8){animation-delay:.62s}.tile:nth-child(9){animation-delay:.68s}
        @keyframes floatIn { from{ opacity:0; transform: translateY(16px) scale(0.92);} to{ opacity:1; transform:none;} }

        /* ── FOOTER ── */
        .footer {
            margin-top: 26px;
            font-family: 'Nunito', sans-serif; font-weight: 600;
            font-size: 0.52rem; letter-spacing: 3px; text-transform: uppercase;
            color: rgba(120,110,115,0.5);
            animation: fade 0.8s ease-out 0.85s both;
        }

        /* ── RESPONSIVE ── */
        @media (min-width: 700px) {
            :root { --tile: 118px; --gap: 22px; }
            .wordmark { font-size: 7rem; }
            .label { font-size: 0.56rem; }
        }
        @media (max-width: 380px) {
            :root { --tile: 25vmin; --gap: 3.4vmin; }
            .wordmark { font-size: 5.2rem; }
        }
        @media (max-height: 730px) {
            .head { margin-bottom: 20px; }
            .wordmark { font-size: 4.8rem; }
            .footer { margin-top: 16px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; }
        }
    </style>
