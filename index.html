<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CHOS</title>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3Cfilter id='glow'%3E%3CfeGaussianBlur stdDeviation='1.5' result='blur'/%3E%3CfeMerge%3E%3CfeMergeNode in='blur'/%3E%3CfeMergeNode in='SourceGraphic'/%3E%3C/feMerge%3E%3C/filter%3E%3C/defs%3E%3Cellipse cx='16' cy='16' rx='12' ry='5.5' fill='none' stroke='%23B8860B' stroke-width='3' filter='url(%23glow)'/%3E%3Cellipse cx='16' cy='16' rx='12' ry='5.5' fill='none' stroke='%23FFD700' stroke-width='1.5'/%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            height: 100%;
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family: 'Cormorant Garamond', serif;
        }

        /* grain */
        body::before {
            content: '';
            position: fixed; inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none; z-index: 0;
        }

        /* gold glow top */
        body::after {
            content: '';
            position: fixed; top: -100px; left: 50%;
            transform: translateX(-50%);
            width: 400px; height: 400px;
            background: radial-gradient(ellipse, rgba(201,168,76,0.05) 0%, transparent 65%);
            pointer-events: none; z-index: 0;
        }

        .screen {
            position: relative; z-index: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px 20px 12px;
            gap: 0;
        }

        /* ── HEADER ── */
        .header {
            text-align: center;
            margin-bottom: 24px;
            animation: fadeDown 0.7s ease-out both;
        }

        .halo {
            width: 110px; height: 22px;
            border: 1.5px solid #C9A84C;
            border-radius: 50%;
            margin: 0 auto 4px;
            box-shadow: 0 0 6px rgba(201,168,76,0.5), 0 0 16px rgba(201,168,76,0.15);
            animation: haloFloat 4s ease-in-out infinite;
        }
        @keyframes haloFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }

        h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 6rem;
            letter-spacing: 12px;
            text-indent: 12px;
            line-height: 1;
            animation: nameReveal 0.9s ease-out 0.1s both;
        }
        @keyframes nameReveal {
            from { opacity:0; letter-spacing:28px; filter:blur(6px); }
            to   { opacity:1; letter-spacing:12px; filter:blur(0); }
        }

        .handle {
            font-size: 1rem;
            font-weight: 300;
            letter-spacing: 4px;
            color: rgba(255,255,255,0.25);
            margin-top: 2px;
            animation: fadeDown 0.7s ease-out 0.25s both;
        }

        @keyframes fadeDown {
            from { opacity:0; transform:translateY(-6px); }
            to   { opacity:1; transform:translateY(0); }
        }
        @keyframes fadeUp {
            from { opacity:0; transform:translateY(6px); }
            to   { opacity:1; transform:translateY(0); }
        }

        /* ── GRID ── */
        /* Switched from 4 columns to 3 columns to suit the reduced tile count.
           Layout: row 1 = spotify / apple / soundcloud
                   row 2 = instagram / tiktok / youtube
                   row 3 = discord / traktrain (centered) */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, var(--tile));
            grid-auto-rows: var(--tile);
            gap: var(--gap);
            justify-content: center;
            animation: fadeUp 0.6s ease-out 0.4s both;
        }

        /* ── TILE ── */
        .tile {
            width: var(--tile);
            height: var(--tile);
            border-radius: calc(var(--tile) * 0.22);
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            text-decoration: none;
            cursor: pointer;
            color: rgba(255,255,255,0.75);
            font-family: 'Cormorant Garamond', serif;
            font-size: 0.6rem;
            font-weight: 300;
            letter-spacing: 1.5px;
            text-transform: lowercase;
            transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
            -webkit-user-select: none;
            user-select: none;
        }
        .tile svg { width: calc(var(--tile) * 0.38); height: calc(var(--tile) * 0.38); flex-shrink: 0; display: block; }
        .tile:active { transform: scale(0.86); }
        .tile:hover  { transform: scale(1.06); box-shadow: 0 6px 20px rgba(0,0,0,0.55); background: rgba(255,255,255,0.07); }

        /* platform border tints */
        .tk { border-color: rgba(83,252,24,0.2); }
        .ts { border-color: rgba(29,185,84,0.2); }
        .ta { border-color: rgba(252,60,68,0.15); }
        .tc { border-color: rgba(255,85,0,0.2); }
        .ti { border-color: rgba(253,89,73,0.18); }
        .ty { border-color: rgba(255,0,0,0.18); }
        .tn { border-color: rgba(255,252,0,0.18); }
        .td { border-color: rgba(88,101,242,0.25); }
        .tt { border-color: rgba(255,255,255,0.22); }
        .te { border-color: rgba(201,168,76,0.25); background: rgba(201,168,76,0.04); color: rgba(201,168,76,0.85); }

        /* ── FOOTER ── */
        .footer {
            margin-top: 18px;
            font-size: 0.48rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.07);
            animation: fadeUp 0.6s ease-out 0.8s both;
        }

        /* ── MODALS ── */
        .overlay {
            display: none;
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 100;
            align-items: flex-end;
            justify-content: center;
        }
        .overlay.open { display: flex; }

        .sheet {
            width: 100%;
            max-width: 390px;
            background: #0f0f0f;
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 24px 24px 0 0;
            padding: 12px 24px 36px;
            animation: slideUp 0.28s cubic-bezier(0.34,1.15,0.64,1) both;
        }
        @keyframes slideUp {
            from { transform: translateY(100%); opacity: 0; }
            to   { transform: translateY(0);    opacity: 1; }
        }

        .pill {
            width: 32px; height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            margin: 0 auto 20px;
        }

        .sheet h2 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.8rem;
            letter-spacing: 4px;
            margin-bottom: 3px;
        }
        .sheet-sub {
            font-size: 0.72rem;
            letter-spacing: 1.8px;
            color: rgba(255,255,255,0.28);
            font-style: italic;
            margin-bottom: 18px;
        }

        .copy-btn {
            width: 100%; padding: 11px;
            background: rgba(201,168,76,0.08);
            border: 1px solid rgba(201,168,76,0.18);
            border-radius: 12px;
            color: rgba(201,168,76,0.82);
            font-family: 'Cormorant Garamond', serif;
            font-size: 0.84rem; letter-spacing: 2.5px;
            text-transform: lowercase; cursor: pointer;
            transition: all 0.2s;
        }
        .copy-btn:hover { background: rgba(201,168,76,0.14); color: #C9A84C; }

        /* ── RESPONSIVE SIZING ── */
        :root {
            --tile: 24vmin;
            --gap: 4vmin;
        }

        @media (min-width: 700px) {
            :root {
                --tile: 130px;
                --gap: 18px;
            }
            h1 { font-size: 6.5rem; letter-spacing: 16px; text-indent: 16px; }
            .halo { width: 110px; height: 22px; }
            .handle { font-size: 1rem; letter-spacing: 5px; }
            .header { margin-bottom: 32px; }
            .tile { font-size: 0.68rem; letter-spacing: 1.8px; }
            .footer { margin-top: 24px; font-size: 0.52rem; }
        }

        @media (max-height: 620px) and (max-width: 699px) {
            :root { --tile: 18vmin; --gap: 3vmin; }
            h1 { font-size: 3rem; }
            .header { margin-bottom: 12px; }
        }
    </style>
</head>
