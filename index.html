<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CHOS</title>
<meta name="description" content="CHOS — music, beats and everywhere to find me.">
<meta name="theme-color" content="#050304">

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg fill='%23e6e2d9'%3E%3Ccircle cx='11' cy='19' r='6'/%3E%3Ccircle cx='20' cy='18' r='7'/%3E%3Ccircle cx='16' cy='14' r='6'/%3E%3Ccircle cx='23' cy='21' r='4'/%3E%3Ccircle cx='9' cy='21' r='4'/%3E%3C/g%3E%3C/svg%3E">

<!-- only the 4 letters of the wordmark are downloaded, so this is tiny -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap&text=CHOS" rel="stylesheet">

<style>
  /* ============================================================
     CHOS — handheld in a dark lounge
     Links live in the <body>: each app is one <a href="...">.

     OPTIONAL ICON IMAGES
     Put image files in a folder called "icons" next to this page
     and they replace the drawn icons automatically:
       icons/spotify.png      icons/apple-music.png
       icons/soundcloud.png   (used by SoundCloud, Archive, prod. CHOS)
       icons/youtube.png      icons/instagram.png
       icons/tiktok.png       icons/beats.png
       icons/discord.png
     Square images around 180x180 keep it fast.
     No file = the drawn icon shows.
     ============================================================ */

  :root {
    color-scheme: dark;
    --w: min(92vw, 380px, calc((100vh - 40px) / 1.9));
  }
  @supports (height: 100dvh) {
    :root { --w: min(92vw, 380px, calc((100dvh - 40px) / 1.9)); }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { background: #050304; }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 0;
    overflow-x: hidden;
    font-family: "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }

  /* ---------- the room: dark, quiet, static ---------- */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      /* a few far-off lights, out of focus */
      radial-gradient(circle at 9% 30%,  rgba(255,176,96,0.10) 0, rgba(255,176,96,0.07) 2.6vmin, rgba(255,176,96,0) 4.4vmin),
      radial-gradient(circle at 21% 62%, rgba(255,90,160,0.08) 0, rgba(255,90,160,0.05) 3.6vmin, rgba(255,90,160,0) 5.6vmin),
      radial-gradient(circle at 16% 84%, rgba(255,196,128,0.07) 0, rgba(255,196,128,0.04) 4vmin, rgba(255,196,128,0) 6vmin),
      radial-gradient(circle at 86% 26%, rgba(150,120,255,0.09) 0, rgba(150,120,255,0.06) 3vmin, rgba(150,120,255,0) 5vmin),
      radial-gradient(circle at 92% 58%, rgba(255,176,96,0.08) 0, rgba(255,176,96,0.05) 2.2vmin, rgba(255,176,96,0) 3.8vmin),
      radial-gradient(circle at 78% 80%, rgba(255,110,170,0.06) 0, rgba(255,110,170,0.04) 4.4vmin, rgba(255,110,170,0) 6.4vmin),
      /* colour washes */
      radial-gradient(45% 35% at 8% 10%,  rgba(255,50,140,0.09), rgba(255,50,140,0) 70%),
      radial-gradient(45% 35% at 92% 8%,  rgba(110,80,255,0.10), rgba(110,80,255,0) 70%),
      radial-gradient(70% 28% at 50% 104%, rgba(255,140,60,0.07), rgba(255,140,60,0) 70%),
      radial-gradient(120% 90% at 50% 45%, #110A0E 0%, #060405 65%, #020102 100%);
  }

  /* ---------- the device ---------- */
  .device {
    position: relative;
    z-index: 1;
    width: var(--w);
    aspect-ratio: 1 / 1.9;
    container-type: inline-size;
    border-radius: 14% / 7.37%;
    background: linear-gradient(155deg, #474B5A 0%, #262833 34%, #121319 72%, #1B1C25 100%);
    box-shadow:
      inset 0 0 0 1.5px rgba(255,255,255,0.14),
      inset 0 2px 1px rgba(255,255,255,0.22),
      inset 0 -3px 6px rgba(0,0,0,0.6),
      0 30px 60px -24px rgba(0,0,0,0.95),
      0 0 90px -20px rgba(120,96,255,0.22);
    animation: rise 0.6s cubic-bezier(0.2,0.8,0.25,1) both;
  }
  /* glass sheen */
  .device::after {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 5;
    border-radius: inherit;
    pointer-events: none;
    background: linear-gradient(118deg,
      rgba(255,255,255,0.12) 0%, rgba(255,255,255,0.025) 30%,
      rgba(255,255,255,0) 30.4%, rgba(255,255,255,0) 100%);
  }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  .bezel-top {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 22cqw;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3.4cqw;
  }
  .cam {
    width: 2.6cqw; height: 2.6cqw; border-radius: 50%;
    background: radial-gradient(circle at 38% 35%, #5F739F 0%, #151A2A 45%, #050608 72%);
    box-shadow: 0 1px 0 rgba(255,255,255,0.1);
  }
  .speaker {
    width: 15cqw; height: 1.7cqw; border-radius: 1cqw;
    background: #07080B;
    box-shadow: inset 0 1px 1px rgba(0,0,0,0.9), 0 1px 0 rgba(255,255,255,0.1);
  }

  /* ---------- the screen ---------- */
  .screen {
    position: absolute;
    top: 22cqw;
    left: 6cqw;
    width: 88cqw;
    height: 142cqw;
    border-radius: 1.2cqw;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 0 1.3cqw #040406, 0 0 0 calc(1.3cqw + 1px) rgba(255,255,255,0.05);
    /* dusk wallpaper */
    background:
      radial-gradient(95% 48% at 50% 104%, rgba(255,176,150,0.6) 0%, rgba(255,176,150,0) 70%),
      linear-gradient(180deg, #121940 0%, #29306F 38%, #5A3E8E 70%, #B5678E 100%);
  }

  .wp-puff {
    position: absolute;
    left: -72cqw;
    width: 72cqw;
    height: 26cqw;
    pointer-events: none;
    background:
      radial-gradient(closest-side at 30% 60%, rgba(255,255,255,0.22), rgba(255,255,255,0)),
      radial-gradient(closest-side at 55% 42%, rgba(255,255,255,0.2),  rgba(255,255,255,0)),
      radial-gradient(closest-side at 78% 62%, rgba(255,255,255,0.15), rgba(255,255,255,0));
    animation: wp-drift linear infinite;
  }
  .w1 { top: 12cqw; animation-duration: 46s; animation-delay: -12s; }
  .w2 { top: 60cqw; animation-duration: 64s; animation-delay: -40s; opacity: 0.8; }
  @keyframes wp-drift { from { transform: translateX(0); } to { transform: translateX(330%); } }

  /* status bar */
  .status {
    position: relative;
    z-index: 2;
    height: 6cqw;
    flex: none;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 0 2cqw;
    color: #fff;
    font-weight: 700;
    font-size: 3.1cqw;
    line-height: 1;
    background: linear-gradient(180deg, rgba(0,0,0,0.72), rgba(0,0,0,0.5));
  }
  .status-left { display: flex; align-items: center; gap: 1.2cqw; }
  .wifi { width: 3.8cqw; height: 3.8cqw; }
  .status-right { justify-self: end; display: flex; align-items: center; gap: 1cqw; }
  .batt {
    position: relative;
    width: 6cqw; height: 2.8cqw;
    border: 0.35cqw solid #fff;
    border-radius: 0.6cqw;
    padding: 0.3cqw;
    margin-right: 0.9cqw;
  }
  .batt::before { content: ''; display: block; width: 62%; height: 100%; background: #fff; border-radius: 0.15cqw; }
  .batt::after {
    content: '';
    position: absolute;
    right: -1.15cqw; top: 50%;
    width: 0.7cqw; height: 1.2cqw;
    transform: translateY(-50%);
    background: #fff;
    border-radius: 0 0.25cqw 0.25cqw 0;
  }

  /* wordmark */
  .wordmark {
    position: relative;
    z-index: 1;
    margin-top: 13cqw;
    text-align: center;
    font-family: 'Michroma', "Helvetica Neue", Arial, sans-serif;
    font-weight: 400;
    font-size: 13cqw;
    line-height: 1;
    letter-spacing: 0.14em;
    padding-left: 0.14em;
    color: #fff;
    text-shadow: 0 0 6cqw rgba(196,176,255,0.6), 0 0.5cqw 1.2cqw rgba(0,0,0,0.35);
  }

  /* app grid */
  .apps {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    row-gap: 8cqw;
    padding: 0 1.5cqw;
    margin-top: 14cqw;
  }

  .app {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5cqw;
    min-width: 0;
    color: #fff;
    text-decoration: none;
    outline: none;
    -webkit-user-select: none;
    user-select: none;
  }

  .icon {
    position: relative;
    width: 15.6cqw;
    height: 15.6cqw;
    border-radius: 3.5cqw;
    display: grid;
    place-items: center;
    overflow: hidden;
    background: linear-gradient(180deg, var(--c1) 0%, var(--c2) 100%);
    box-shadow:
      0 0.7cqw 1.4cqw rgba(0,0,0,0.5),
      inset 0 0 0 1px rgba(255,255,255,0.22),
      inset 0 -1cqw 1.8cqw rgba(0,0,0,0.2);
  }
  /* gloss arc */
  .icon::before {
    content: '';
    position: absolute;
    z-index: 3;
    left: -22%; right: -22%;
    top: -64%;
    height: 114%;
    border-radius: 50%;
    pointer-events: none;
    background: linear-gradient(180deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0.1) 100%);
  }
  .icon svg {
    position: relative;
    z-index: 1;
    width: 58%;
    height: 58%;
    overflow: visible;
  }
  /* optional image icons (see note at top) */
  .icon img { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; object-fit: cover; display: none; }
  .icon.custom img { display: block; }
  .icon.custom svg { display: none; }

  .label {
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    font-weight: 700;
    font-size: 2.95cqw;
    white-space: nowrap;
    text-shadow: 0 0.3cqw 0.5cqw rgba(0,0,0,0.85);
  }

  .app:active .icon { filter: brightness(0.6); }
  .app:focus-visible .icon { outline: 0.6cqw solid #fff; outline-offset: 0.7cqw; }

  /* icon colours */
  .spotify    { --c1: #45D98A; --c2: #128A4E; }
  .applemusic { --c1: #A47BFF; --c2: #5B2FD6; }
  .soundcloud { --c1: #FF8800; --c2: #D15500; }
  .youtube    { --c1: #FF6B66; --c2: #C21E2B; }
  .instagram  { --c1: #3FD3C8; --c2: #0E8C8F; }
  .tiktok     { --c1: #222222; --c2: #000000; }
  .beats      { --c1: #FFD36B; --c2: #E08A12; }
  .discord    { --c1: #6E8DFF; --c2: #2D4CC9; }

  /* page dots */
  .dots {
    position: relative;
    z-index: 1;
    margin-top: auto;
    margin-bottom: 2.6cqw;
    display: flex;
    justify-content: center;
    gap: 1.8cqw;
  }
  .dots i { width: 1.5cqw; height: 1.5cqw; border-radius: 50%; background: rgba(255,255,255,0.35); }
  .dots i:first-child { background: #fff; }

  /* dock */
  .dock {
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: center;
    padding: 2.8cqw 1.5cqw 3cqw;
    background: linear-gradient(180deg, rgba(255,255,255,0.24) 0%, rgba(255,255,255,0.08) 100%);
    border-top: 1px solid rgba(255,255,255,0.38);
  }
  .dock .app { width: 21.25cqw; }

  /* chin + button */
  .chin {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 26cqw;
    display: grid;
    place-items: center;
  }
  .home {
    width: 14.5cqw;
    height: 14.5cqw;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    background: radial-gradient(circle at 50% 30%, #0A0B0F 0%, #15161C 55%, #22232C 100%);
    box-shadow:
      inset 0 0.7cqw 1.1cqw rgba(0,0,0,0.9),
      inset 0 -0.3cqw 0.5cqw rgba(255,255,255,0.07),
      0 0 0 0.35cqw rgba(255,255,255,0.05),
      0 0.25cqw 0 0.2cqw rgba(255,255,255,0.05);
  }
  .home:active { transform: scale(0.96); }
  .home:focus-visible { outline: 0.6cqw solid rgba(255,255,255,0.6); outline-offset: 0.8cqw; }

  /* apps pop in on load, and again when the button is pressed */
  .screen.go .app {
    animation: pop 0.45s cubic-bezier(0.2,1.5,0.4,1) both;
    animation-delay: calc(var(--base, 0.3s) + var(--i) * 35ms);
  }
  @keyframes pop { from { opacity: 0; transform: scale(0.5); } to { opacity: 1; transform: none; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<!-- shared gradient for the icon symbols -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="gw" gradientUnits="userSpaceOnUse" x1="0" y1="2" x2="0" y2="22">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE1EC"/>
    </linearGradient>
  </defs>
</svg>

<main class="device">

  <div class="bezel-top" aria-hidden="true">
    <span class="cam"></span>
    <span class="speaker"></span>
  </div>

  <div class="screen go" id="screen">

    <div class="wp-puff w1" aria-hidden="true"></div>
    <div class="wp-puff w2" aria-hidden="true"></div>

    <div class="status" aria-hidden="true">
      <div class="status-left">
        CHOS
        <svg class="wifi" viewBox="0 0 24 24"><g fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M3 9.6a13 13 0 0 1 18 0"/><path d="M6.6 13.2a8 8 0 0 1 10.8 0"/></g><circle cx="12" cy="17.4" r="1.9" fill="#fff"/></svg>
      </div>
      <div>3:33 AM</div>
      <div class="status-right">62%<span class="batt"></span></div>
    </div>

    <h1 class="wordmark">CHOS</h1>

    <nav class="apps" aria-label="Listen and follow">

      <!-- 1. Spotify -->
      <a class="app" style="--i:0" href="https://open.spotify.com/artist/52HsZVwxPHQ13Abuiv0ctn" target="_blank" rel="noopener" aria-label="CHOS on Spotify">
        <span class="icon spotify">
          <img src="icons/spotify.png" alt="" onload="this.parentNode.classList.add('custom')" onerror="this.remove()">

          </svg>
        </span>
        <span class="label">Spotify</span>
      </a>

      <!-- 2. Apple Music -->
      <a class="app" style="--i:1" href="https://music.apple.com/us/artist/chos/1877797174" target="_blank" rel="noopener" aria-label="CHOS on Apple Music">
        <span class="icon applemusic">
          <img src="icons/apple-music.png" alt="" onload="this.parentNode.classList.add('custom')" onerror="this.remove()">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="8.6" cy="17.4" r="3.4" fill="url(#gw)"/>
            <path d="M11 17.4V3.4c2.6 1.5 6.2 2.6 6.2 6.6" fill="none" stroke="url(#gw)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="label">Apple Music</span>

            <g fill="url(#gw)"><circle cx="8.6" cy="13.6" r="4"/><circle cx="13.8" cy="10.8" r="5.2"/><circle cx="18" cy="14.4" r="3.4"/><rect x="4.6" y="13.6" width="16.8" height="4.2" rx="2.1"/></g>

        <span class="icon instagram">
          <img src="icons/instagram.png" alt="" onload="this.parentNode.classList.add('custom')" onerror="this.remove()">
          <svg viewBox="0 0 24 24" aria-hidden="true">

      <!-- 8. prod. CHOS (SoundCloud playlist) -->

        <span class="icon soundcloud">
          <img src="icons/soundcloud.png" alt="" onload="this.parentNode.classList.add('custom')" onerror="this.remove()">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <g fill="url(#gw)"><circle cx="8.6" cy="13.6" r="4"/><circle cx="13.8" cy="10.8" r="5.2"/><circle cx="18" cy="14.4" r="3.4"/><rect x="4.6" y="13.6" width="16.8" height="4.2" rx="2.1"/></g>
          </svg>
        </span>
        <span class="label">prod. CHOS</span>
      </a>

    </nav>

    <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>

    <nav class="dock" aria-label="Beats and community">

      <!-- 9. Buy Beats -->
      <a class="app" style="--i:8" href="https://chosthislife.beatstars.com/" target="_blank" rel="noopener" aria-label="Buy beats from CHOS">
